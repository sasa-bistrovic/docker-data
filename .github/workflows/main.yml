name: Docker Compose

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pull base images
        run: |
          docker pull docker.elastic.co/elasticsearch/elasticsearch:8.12.2
          docker pull zookeeper:latest
          docker pull bitnamilegacy/kafka:4.0.0-debian-12-r10
          docker pull bitnamilegacy/rabbitmq:4.1.3-debian-12-r1
          docker pull bitnamilegacy/redis:8.2.1-debian-12-r0

      - name: Build the Docker images
        run: docker compose build

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker images
        run: |
          docker tag docker.elastic.co/elasticsearch/elasticsearch:8.12.2 \
            ${{ secrets.DOCKER_USERNAME }}/docker-data-elasticsearch:3.0

          docker tag bitnamilegacy/kafka:4.0.0-debian-12-r10 \
            ${{ secrets.DOCKER_USERNAME }}/docker-data-kafka:3.0

          docker tag zookeeper:latest \
            ${{ secrets.DOCKER_USERNAME }}/docker-data-zookeeper:3.0

          docker tag bitnamilegacy/redis:8.2.1-debian-12-r0 \
            ${{ secrets.DOCKER_USERNAME }}/docker-data-redis:3.0

          docker tag bitnamilegacy/rabbitmq:4.1.3-debian-12-r1 \
            ${{ secrets.DOCKER_USERNAME }}/docker-data-rabbitmq:3.0

          docker tag docker-data-spring-boot-elasticsearch \
            ${{ secrets.DOCKER_USERNAME }}/spring-boot-elasticsearch:3.0

          docker tag docker-data-spring-boot-rabbitmq \
            ${{ secrets.DOCKER_USERNAME }}/spring-boot-rabbitmq:3.0

          docker tag docker-data-spring-boot-redis \
            ${{ secrets.DOCKER_USERNAME }}/spring-boot-redis:3.0

          docker tag docker-data-spring-boot-kafka \
            ${{ secrets.DOCKER_USERNAME }}/spring-boot-kafka:3.0

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/docker-data-elasticsearch:3.0
          docker push ${{ secrets.DOCKER_USERNAME }}/docker-data-rabbitmq:3.0
          docker push ${{ secrets.DOCKER_USERNAME }}/docker-data-redis:3.0
          docker push ${{ secrets.DOCKER_USERNAME }}/docker-data-kafka:3.0
          docker push ${{ secrets.DOCKER_USERNAME }}/docker-data-zookeeper:3.0

          docker push ${{ secrets.DOCKER_USERNAME }}/spring-boot-elasticsearch:3.0
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-boot-rabbitmq:3.0
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-boot-redis:3.0
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-boot-kafka:3.0

      - name: Deploy with Docker Compose
        run: docker compose up -d
